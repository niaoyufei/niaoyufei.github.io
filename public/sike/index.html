<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>《三体 II：黑暗森林》共读问答笔记</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0b0f19;
      background-image: radial-gradient(#1e293b 1px, transparent 1px);
      background-size: 24px 24px;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .glass {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
    }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body.is-locked > header,
    body.is-locked > #stage,
    body.is-locked > #map-controls,
    body.is-locked > #map-hint {
      display: none !important;
    }

    /* ===== 星图画布 ===== */
    #stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
    #stage.dragging { cursor: grabbing; }
    #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
    #world.animating { transition: transform 0.6s cubic-bezier(0.22, 0.61, 0.36, 1); }
    #links-layer { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
    .link { stroke: #64748b; stroke-opacity: 0.35; stroke-width: 1; transition: stroke-opacity 0.4s, stroke 0.4s; }
    .link.is-active { stroke: #cbd5e1; stroke-opacity: 0.7; }
    .link.is-faint { stroke-opacity: 0.12; }
    .link.is-hidden { stroke-opacity: 0; }

    .star { position: absolute; width: max-content; transform: translate(-50%, calc(var(--r) * -1)); display: flex; flex-direction: column; align-items: center; gap: 6px;
            background: none; border: 0; padding: 0; cursor: pointer; color: inherit; transition: opacity 0.4s; outline: none; }
    .star-dot { width: calc(var(--r) * 2); height: calc(var(--r) * 2); border-radius: 9999px; background: #94a3b8;
                box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.10), 0 0 14px rgba(148, 163, 184, 0.25); transition: transform 0.3s, background 0.3s, box-shadow 0.3s; }
    .star-label { width: max-content; max-width: 10em; font-size: 12px; line-height: 1.35; color: #94a3b8; text-align: center; white-space: normal; transition: color 0.3s; }
    .star:hover .star-dot, .star:focus-visible .star-dot { background: #e2e8f0; transform: scale(1.15); }
    .star:hover .star-label, .star:focus-visible .star-label { color: #f1f5f9; }
    .star.is-focus .star-dot { background: #f8fafc; transform: scale(1.25); box-shadow: 0 0 0 6px rgba(248, 250, 252, 0.10), 0 0 28px rgba(248, 250, 252, 0.45); }
    .star.is-focus .star-label { color: #fff; font-weight: 600; }
    .star.is-neighbor { opacity: 0.85; }
    .star.is-hidden { opacity: 0; pointer-events: none; }
    .star.is-faint { opacity: 0.18; }
    .star.is-match .star-dot { background: #f8fafc; animation: star-breathe 1.6s ease-in-out infinite; }
    .star.is-match .star-label { color: #fff; }
    @keyframes star-breathe {
      0%, 100% { box-shadow: 0 0 0 3px rgba(248, 250, 252, 0.15), 0 0 12px rgba(248, 250, 252, 0.35); }
      50% { box-shadow: 0 0 0 8px rgba(248, 250, 252, 0.06), 0 0 26px rgba(248, 250, 252, 0.6); }
    }
    @media (prefers-reduced-motion: reduce) {
      #world.animating { transition: none; }
      .star.is-match .star-dot { animation: none; }
    }
    .map-ctrl { width: 36px; height: 36px; border-radius: 12px; background: rgba(15, 23, 42, 0.88); border: 1px solid #1e293b; color: #94a3b8; font-size: 16px; }
    .map-ctrl:hover { color: #f1f5f9; border-color: #334155; }
    input[type="search"]::-webkit-search-cancel-button { filter: invert(0.6); }
    /* ===== 单点聚焦：中心问题卡 + 四维辐射框 + 外侧竖向手风琴折叠列 ===== */
    #mindmap-layer { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
    #mindmap-links { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
    .mm-branch-line { stroke: #475569; stroke-opacity: 0.65; stroke-width: 1.25; fill: none; stroke-dasharray: 3 3; }

    .focus-center-card {
      position: absolute;
      width: 280px;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.32);
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.04);
      pointer-events: auto;
      cursor: pointer;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .focus-center-card:hover {
      border-color: rgba(226, 232, 240, 0.48);
    }

    .dim-anchor {
      position: absolute;
      width: 290px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .dim-king-card {
      width: 290px;
      background: rgba(15, 23, 42, 0.90);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(71, 85, 105, 0.48);
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.50);
      pointer-events: auto;
      cursor: pointer;
      transition: border-color 0.25s, transform 0.25s, background 0.25s;
    }
    .dim-king-card:hover,
    .dim-king-card.is-subfocused {
      border-color: rgba(203, 213, 225, 0.55);
      background: rgba(15, 23, 42, 0.96);
    }

    /* 榜一框紧邻外侧：短线 + 竖向手风琴折叠窄条列 */
    .dim-outer-wrap {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      pointer-events: none;
    }
    .dim-outer-wrap.is-left {
      right: 100%;
      flex-direction: row-reverse;
    }
    .dim-outer-wrap.is-right {
      left: 100%;
      flex-direction: row;
    }
    .dim-short-line {
      width: 22px;
      height: 1px;
      background: rgba(100, 116, 139, 0.55);
      flex-shrink: 0;
    }
    .dim-acc-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 216px;
      pointer-events: auto;
    }
    .acc-strip {
      background: rgba(15, 23, 42, 0.86);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(51, 65, 85, 0.65);
      border-radius: 10px;
      padding: 8px 11px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, width 0.2s;
      text-align: left;
    }
    .acc-strip:hover {
      border-color: rgba(148, 163, 184, 0.5);
      background: rgba(15, 23, 42, 0.95);
    }
    .acc-strip.is-open {
      width: 244px;
      background: rgba(15, 23, 42, 0.96);
      border-color: rgba(203, 213, 225, 0.5);
      padding: 11px 13px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.55);
    }
    .dim-outer-wrap.is-left .dim-acc-col {
      align-items: flex-end;
    }
    .dim-outer-wrap.is-right .dim-acc-col {
      align-items: flex-start;
    }

    /* 聚焦时隐藏中心问题原本的小圆点（由中心卡片替代） */
    .star.is-focus {
      opacity: 0;
      pointer-events: none;
    }
    .star.is-neighbor {
      opacity: 0.92;
      transition: left 0.45s cubic-bezier(0.22, 0.61, 0.36, 1), top 0.45s cubic-bezier(0.22, 0.61, 0.36, 1), opacity 0.35s;
    }
    .star.is-neighbor .star-dot {
      background: #cbd5e1;
      box-shadow: 0 0 0 4px rgba(203, 213, 225, 0.12), 0 0 16px rgba(203, 213, 225, 0.3);
    }
    .star.is-neighbor .star-label {
      color: #cbd5e1;
    }
    dialog#answer-dialog {
      background: transparent;
      border: 0;
      padding: 0;
      max-width: min(92vw, 480px);
      width: 100%;
      color: #f8fafc;
    }
    dialog#answer-dialog::backdrop {
      background-color: rgba(2, 6, 23, 0.68);
      backdrop-filter: blur(4px);
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body class="is-locked">

  <!-- ==================== 静态口令锁屏遮罩（首次外网访问需输入口令，验证后本机持久免输） ==================== -->
  <div id="static-lock-screen" class="fixed inset-0 bg-slate-950 z-[100] flex items-center justify-center p-4">
    <form onsubmit="handleStaticUnlock(event)" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
      <div class="text-center space-y-1.5">
        <div class="text-2xl">🔒</div>
        <h1 class="text-base font-bold text-white">私人读书笔记 · 访问验证</h1>
        <p class="text-xs text-slate-400">请输入专属访问口令（验证一次后本设备自动记住）</p>
      </div>
      <input id="static-lock-input" type="password" placeholder="请输入访问口令" autofocus required
        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-center text-white focus:outline-none focus:border-amber-500">
      <p id="static-lock-error" class="hidden text-xs text-rose-400 text-center">口令不正确，请重新输入</p>
      <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs py-2.5 rounded-xl transition shadow">
        验证进入
      </button>
    </form>
  </div>

  <script>
    const PASS_HASH_TARGET = "24zo8m3o1bj";
    const PASS_STORAGE_KEY = "sike_auth_hash_v1";

    function hashPasscode(str) {
      const input = "sike_lock_v1:" + String(str || "");
      let h1 = 0xdeadbeef ^ input.length, h2 = 0x41c6ce57 ^ input.length;
      for (let i = 0, ch; i < input.length; i++) {
        ch = input.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
    }

    function unlockPage() {
      document.body.classList.remove("is-locked");
      const lockEl = document.getElementById("static-lock-screen");
      if (lockEl) lockEl.classList.add("hidden");
    }

    function lockPageAgain() {
      localStorage.removeItem(PASS_STORAGE_KEY);
      document.body.classList.add("is-locked");
      const lockEl = document.getElementById("static-lock-screen");
      if (lockEl) lockEl.classList.remove("hidden");
      const inputEl = document.getElementById("static-lock-input");
      if (inputEl) {
        inputEl.value = "";
        inputEl.focus();
      }
    }

    function handleStaticUnlock(event) {
      event.preventDefault();
      const val = (document.getElementById("static-lock-input")?.value || "").trim();
      const errEl = document.getElementById("static-lock-error");
      if (hashPasscode(val) === PASS_HASH_TARGET) {
        localStorage.setItem(PASS_STORAGE_KEY, PASS_HASH_TARGET);
        if (errEl) errEl.classList.add("hidden");
        unlockPage();
      } else {
        if (errEl) errEl.classList.remove("hidden");
      }
    }

    (function checkInitialLock() {
      try {
        const params = new URLSearchParams(window.location.search);
        const urlKey = params.get("key");
        if (urlKey && hashPasscode(urlKey) === PASS_HASH_TARGET) {
          localStorage.setItem(PASS_STORAGE_KEY, PASS_HASH_TARGET);
          params.delete("key");
          const cleanUrl = window.location.pathname + (params.toString() ? "?" + params.toString() : "") + window.location.hash;
          window.history.replaceState({}, "", cleanUrl);
          unlockPage();
          return;
        }
        if (localStorage.getItem(PASS_STORAGE_KEY) === PASS_HASH_TARGET) {
          unlockPage();
        }
      } catch (_) {}
    })();
  </script>

  <!-- ==================== 顶部悬浮栏：书名 + 搜索框 + 提问按钮 ==================== -->
  <header id="top-bar" class="fixed top-3 left-1/2 -translate-x-1/2 z-30 w-[min(96vw,760px)] glass border border-slate-800/80 rounded-2xl px-2.5 py-2 flex items-center gap-2 shadow-2xl">
    <button onclick="resetView()" title="回到全景" class="shrink-0 text-sm font-semibold text-slate-200 hover:text-white px-1.5 transition">
      <span class="hidden sm:inline">《三体 II：黑暗森林》</span><span class="sm:hidden">三体 II</span>
    </button>

    <div class="relative flex-1 min-w-0">
      <input id="unified-search-input" type="search" autocomplete="off" enterkeyhint="send"
        oninput="handleSearchInput(this.value)"
        onkeydown="handleSearchKeydown(event)"
        placeholder="搜索或直接提问…"
        aria-label="搜索问题，或直接输入新问题"
        class="w-full min-w-0 bg-slate-950/70 border border-slate-800 focus:border-slate-500 rounded-xl px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none transition">
      <div id="search-hint" class="hidden absolute left-0 right-0 top-full mt-2 text-xs text-slate-400 bg-slate-950/95 border border-slate-800 rounded-xl px-3 py-2 shadow-xl"></div>
    </div>

    <button onclick="onAskButton()" class="shrink-0 text-xs bg-slate-100 hover:bg-white text-slate-950 font-semibold px-3.5 py-2 rounded-xl transition">
      提问
    </button>

    <!-- 低调 ··· 更多菜单（收纳云端同步、重置与重新上锁） -->
    <div class="relative shrink-0" id="header-more-wrap">
      <button onclick="toggleHeaderMoreMenu(event)" title="更多设置" class="text-xs px-2.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-800 transition font-bold">
        ···
      </button>
      <div id="header-more-menu" class="hidden absolute right-0 mt-2 w-48 bg-slate-900 border border-slate-700/90 rounded-xl shadow-2xl py-1.5 z-50 text-xs">
        <button onclick="openSyncModal(); hideHeaderMoreMenu();" class="w-full px-3.5 py-2 text-left text-slate-200 hover:bg-slate-800 flex items-center justify-between">
          <span>云端同步与备份</span>
          <span class="flex items-center gap-1 text-[11px] text-emerald-400">
            <span id="cloud-status-dot" class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block"></span>
            <span id="cloud-status-text">已连</span>
          </span>
        </button>
        <button onclick="lockPageAgain(); hideHeaderMoreMenu();" class="w-full px-3.5 py-2 text-left text-slate-300 hover:bg-slate-800">
          锁定当前设备访问
        </button>
        <div class="border-t border-slate-800 my-1"></div>
        <button onclick="resetDemoData(); hideHeaderMoreMenu();" class="w-full px-3.5 py-2 text-left text-rose-400 hover:bg-slate-800">
          重置初始演示数据
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== 全屏无边界星图画布（拖拽平移 + 滚轮/双指缩放） ==================== -->
  <div id="stage" aria-label="问题星图">
    <div id="world">
      <svg id="links-layer" aria-hidden="true"></svg>
      <svg id="mindmap-links" aria-hidden="true"></svg>
      <div id="nodes-layer"></div>
      <div id="mindmap-layer"></div>
    </div>
  </div>

  <!-- 聚焦态底部轻巧导航（支持两段式防迷路返回） -->
  <div id="focus-nav-bar" class="hidden fixed left-1/2 -translate-x-1/2 bottom-8 z-20 flex items-center gap-2">
    <button id="btn-back-center" type="button" onclick="panToFocusOverview(true)"
      class="hidden text-xs px-3 py-1.5 rounded-full glass border border-slate-700 text-slate-200 hover:text-white hover:border-slate-500 shadow-lg transition">
      回到问题中心
    </button>
    <button type="button" onclick="resetView()"
      class="text-xs px-3 py-1.5 rounded-full glass border border-slate-800 text-slate-400 hover:text-slate-200 hover:border-slate-600 shadow-lg transition">
      返回全局星图
    </button>
  </div>

  <!-- 右下角极简缩放控件 -->
  <div id="map-controls" class="fixed right-3 bottom-3 z-20 flex flex-col gap-1.5">
    <button onclick="zoomBy(1.25)" title="放大" aria-label="放大" class="map-ctrl">+</button>
    <button onclick="zoomBy(0.8)" title="缩小" aria-label="缩小" class="map-ctrl">−</button>
    <button onclick="resetView()" title="回到全景" aria-label="回到全景" class="map-ctrl text-xs">全景</button>
  </div>
  <div id="map-hint" class="fixed left-1/2 -translate-x-1/2 bottom-3 z-20 text-[11px] text-slate-500 pointer-events-none whitespace-nowrap">
    拖动平移 · 滚轮或双指缩放 · 点击圆点聚焦
  </div>

  <!-- ==================== 零负担写回答弹窗（直接写 + 自动识别四维归类 + 浅灰例子启发） ==================== -->
  <dialog id="answer-dialog" closedby="any" aria-labelledby="answer-dialog-title" class="rounded-2xl">
    <form onsubmit="submitAnswerForm(event)" class="bg-slate-900/95 border border-slate-700/90 rounded-2xl p-5 shadow-2xl space-y-3.5 text-left">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <h2 id="answer-dialog-title" class="text-xs font-medium text-slate-400">写下你的理解</h2>
          <p id="answer-dialog-question" class="text-sm font-semibold text-slate-100 mt-1 line-clamp-2 leading-snug"></p>
        </div>
        <button type="button" onclick="closeAnswerDialog()" aria-label="关闭" class="text-slate-500 hover:text-slate-200 text-lg leading-none px-1">&times;</button>
      </div>

      <!-- 顺着某维度 + 点进来时的半行榜一参考（从中心点进来则隐藏） -->
      <div id="answer-example-bar" class="hidden text-xs text-slate-400 bg-slate-950/70 border border-slate-800/80 rounded-xl px-3 py-2 leading-relaxed"></div>

      <textarea id="answer-text-input" rows="4" maxlength="220" required
        oninput="handleAnswerTextInput(this.value)"
        placeholder="写下你的理解…（比如：用一句话大白话点破 / 补齐书里没明说的背景设定 / 拿生活常识打个比方 / 点出和前后哪段情节呼应）"
        class="w-full bg-slate-950 border border-slate-800 focus:border-slate-500 rounded-xl p-3.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none leading-relaxed transition"></textarea>

      <div class="flex flex-wrap items-center justify-between gap-2 pt-0.5">
        <div class="flex items-center gap-2">
          <input id="answer-author-input" type="text" maxlength="20" placeholder="署名（选填）"
            class="bg-slate-950 border border-slate-800 focus:border-slate-600 rounded-lg px-2.5 py-1.5 text-xs text-slate-300 placeholder-slate-600 w-28 focus:outline-none">
          <!-- 低调自动归类提示（默认无需操作，点击可顺手微调） -->
          <button type="button" id="answer-dim-badge" onclick="cycleAnswerDimOverride()" title="点击可手动切换归类维度"
            class="text-[11px] px-2.5 py-1 rounded-lg bg-slate-950 border border-slate-800 text-slate-400 hover:text-slate-200 hover:border-slate-600 transition">
            自动归入：直白真相
          </button>
        </div>

        <button type="submit" class="text-xs bg-slate-100 hover:bg-white text-slate-950 font-semibold px-4 py-2 rounded-xl transition">
          发送
        </button>
      </div>
    </form>
  </dialog>

  <!-- ==================== 跨设备云端同步与数据备份弹窗（从顶栏 ··· 唤起） ==================== -->
  <div id="sync-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <div>
          <h3 class="text-base font-bold text-white">☁️ 跨设备云端实时同步</h3>
          <p class="text-xs text-slate-400 mt-0.5">手机在外网新增的问答，回家在电脑打开自动互通</p>
        </div>
        <button onclick="closeSyncModal()" class="text-slate-400 hover:text-white text-2xl leading-none">&times;</button>
      </div>

      <div class="bg-slate-950/80 border border-slate-800 rounded-xl p-3.5 space-y-2">
        <div class="flex items-center justify-between text-xs">
          <span class="text-slate-400">当前同步状态：</span>
          <span id="sync-modal-status" class="font-bold text-emerald-400">☁️ 已连接默认云端空间</span>
        </div>
        <div class="flex gap-2 pt-1">
          <button onclick="pullFromCloud(true)" class="flex-1 text-xs py-2 rounded-lg bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-300 border border-emerald-500/30 font-semibold transition">
            🔄 立即从云端拉取
          </button>
          <button onclick="pushToCloud(true)" class="flex-1 text-xs py-2 rounded-lg bg-amber-500/15 hover:bg-amber-500/25 text-amber-300 border border-amber-500/30 font-semibold transition">
            ☁️ 推送本机到云端
          </button>
        </div>

    let nodeHistoryStack = []; // 顺藤摸瓜连续跳转返回栈

    // 本地已同问 / 已赞同即时状态（支持点击高亮 +1，再次点击取消）
    let likedQuestions = JSON.parse(localStorage.getItem("bookgraph_liked_questions") || "{}");
    let likedNotes = JSON.parse(localStorage.getItem("bookgraph_liked_notes") || "{}");

    // 自动补齐旧缓存缺失的演示连线与四维/手风琴回答（保留用户新增内容）
    function upgradeAndNormalizeData(list) {
      if (!Array.isArray(list)) return JSON.parse(JSON.stringify(defaultData));
      const byId = new Map(list.map(n => [n.id, n]));
      defaultData.forEach(defNode => {
        const cur = byId.get(defNode.id);
        if (!cur) {
          list.push(JSON.parse(JSON.stringify(defNode)));
          return;
        }
        cur.links = Array.from(new Set([...(cur.links || []), ...(defNode.links || [])]));
        cur.branches = cur.branches || { d1: [], d2: [], d3: [], d4: [] };
        ["d1", "d2", "d3", "d4"].forEach(k => {
          cur.branches[k] = cur.branches[k] || [];
          const existingIds = new Set(cur.branches[k].map(x => x.id));
          (defNode.branches[k] || []).forEach(dn => {
            if (!existingIds.has(dn.id)) cur.branches[k].push(JSON.parse(JSON.stringify(dn)));
          });
        });
      });
      return list;
    }
    appData = upgradeAndNormalizeData(appData);

    // ==================== 单点聚焦四维脑图状态与坐标计算 ====================
    let subFocusTarget = null; // null | { type: 'dim' | 'acc', dimKey, noteId }
    let expandedAccNotes = {}; // { "dimKey_noteId": true }

    // 四个维度的四角辐射偏移（相对于中心问题坐标 cx, cy）
    const DIM_SLOTS = {
      d1: { dx: -330, dy: -155, side: "left" },
      d2: { dx:  330, dy: -155, side: "right" },
      d3: { dx: -330, dy:  155, side: "left" },
      d4: { dx:  330, dy:  155, side: "right" }
    };

    function getDimSlot(dimKey, litDims) {
      // 若只有 1 或 2 个维度有回答，保持左右对称舒展
      if (litDims.length === 1) {
        return { dx: 330, dy: 0, side: "right" };
      }
      if (litDims.length === 2) {
        const idx = litDims.indexOf(dimKey);
        return idx === 0
          ? { dx: -330, dy: 0, side: "left" }
          : { dx:  330, dy: 0, side: "right" };
      }
      return DIM_SLOTS[dimKey] || { dx: 330, dy: 0, side: "right" };
    }

    // 计算聚焦态下边缘“关联问题小节点”的环绕位置（放在上下边缘走廊，避免与左右四维框重叠）
    function getFocusedNeighborPos(cx, cy, neighborId, neighborList) {
      const idx = neighborList.indexOf(neighborId);
      const count = neighborList.length;
      if (idx === -1) return nodePositions[neighborId] || { x: cx, y: cy - 300 };
      // 交替排布在上方与下方外缘
      const isTop = idx % 2 === 0;
      const rowIdx = Math.floor(idx / 2);
      const rowTotal = Math.ceil(( isTop ? count : count - 1 ) / 2);
      const spreadX = (rowIdx - (rowTotal - 1) / 2) * 190;
      const py = isTop ? cy - 295 : cy + 295;
      return { x: cx + spreadX, y: py };
    }

    function updateFocusNavBar() {
      const bar = document.getElementById("focus-nav-bar");
      const hint = document.getElementById("map-hint");
      if (!bar) return;
      if (!focusedNodeId) {
        bar.classList.add("hidden");
        if (hint) hint.textContent = "拖动平移 · 滚轮或双指缩放 · 点击圆点聚焦";
        return;
      }
      bar.classList.remove("hidden");
      const backCenterBtn = document.getElementById("btn-back-center");
      if (backCenterBtn) {
        backCenterBtn.classList.toggle("hidden", !subFocusTarget);
      }
      if (hint) {
        hint.textContent = subFocusTarget
          ? "点击空白处回到问题中心 · 再次点击空白处返回全局星图"
          : "点击维度框或外侧折叠条自动移镜 · 点击空白处返回星图";
      }
    }

    function renderMindmap() {
      const mmLayer = document.getElementById("mindmap-layer");
      const mmLinks = document.getElementById("mindmap-links");
      if (!mmLayer || !mmLinks) return;

      // 先恢复所有星图圆点的默认世界坐标与连线坐标
      document.querySelectorAll("#nodes-layer .star").forEach(el => {
        const p = nodePositions[el.dataset.id];
        if (p) {
          el.style.left = `${p.x}px`;
          el.style.top = `${p.y}px`;
        }
      });
      document.querySelectorAll("#links-layer .link").forEach(el => {
        const a = nodePositions[el.dataset.a], b = nodePositions[el.dataset.b];
        if (a && b) {
          el.setAttribute("x1", a.x); el.setAttribute("y1", a.y);
          el.setAttribute("x2", b.x); el.setAttribute("y2", b.y);
        }
      });

      if (!focusedNodeId) {
        mmLayer.innerHTML = "";
        mmLinks.innerHTML = "";
        updateFocusNavBar();
        return;
      }

      const node = getNodeById(focusedNodeId);
      const centerPos = nodePositions[focusedNodeId];
      if (!node || !centerPos) {
        mmLayer.innerHTML = "";
        mmLinks.innerHTML = "";
        updateFocusNavBar();
        return;
      }

      const cx = centerPos.x, cy = centerPos.y;

      // 1. 将与当前问题有连线的“关联问题小节点”移到上下边缘，并更新连接线直接连向中心问题
      const neighborList = Array.from(getNeighborIds(focusedNodeId));
      const neighborPosMap = {};
      neighborList.forEach(nid => {
        neighborPosMap[nid] = getFocusedNeighborPos(cx, cy, nid, neighborList);
      });

      document.querySelectorAll("#nodes-layer .star.is-neighbor").forEach(el => {
        const np = neighborPosMap[el.dataset.id];
        if (np) {
          el.style.left = `${np.x}px`;
          el.style.top = `${np.y}px`;
        }
      });

      document.querySelectorAll("#links-layer .link.is-active").forEach(el => {
        const aId = el.dataset.a, bId = el.dataset.b;
        const pa = aId === focusedNodeId ? { x: cx, y: cy } : (neighborPosMap[aId] || nodePositions[aId]);
        const pb = bId === focusedNodeId ? { x: cx, y: cy } : (neighborPosMap[bId] || nodePositions[bId]);
        if (pa && pb) {
          el.setAttribute("x1", pa.x); el.setAttribute("y1", pa.y);
          el.setAttribute("x2", pb.x); el.setAttribute("y2", pb.y);
        }
      });

      // 2. 筛选已有回答的维度（仅显示已有回答的维度）
      const litDims = ["d1", "d2", "d3", "d4"].filter(k => getActiveNotes(node, k).length > 0);

      // 3. 绘制中心问题到四个维度框的平滑辐射连线
      const branchPaths = [];
      litDims.forEach(dimKey => {
        const slot = getDimSlot(dimKey, litDims);
        const tx = cx + slot.dx, ty = cy + slot.dy;
        const c1x = cx + slot.dx * 0.45, c1y = cy;
        const c2x = cx + slot.dx * 0.55, c2y = ty;
        branchPaths.push(`<path class="mm-branch-line" d="M ${cx} ${cy} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${tx} ${ty}" />`);
      });
      mmLinks.innerHTML = branchPaths.join("");

      // 4. 渲染中心问题卡 + 四周辐射维度框 + 榜一框外侧短线挂接的竖向手风琴折叠块
      const qLiked = isQuestionLiked(node.id);
      const centerHtml = `
        <div class="focus-center-card" onclick="onCenterCardClick(event)">
          <div class="text-[15px] font-semibold text-white leading-snug">
            ${escapeHtml(node.confusion)}
          </div>
          ${node.quote ? `
            <div class="text-xs text-slate-400 mt-2 leading-relaxed border-l border-slate-700 pl-2.5">
              ${escapeHtml(node.quote)}
            </div>
          ` : ""}
          <div class="flex items-center justify-between gap-2 mt-3.5 pt-2.5 border-t border-slate-800/90 text-[11px] text-slate-400">
            <button type="button" onclick="toggleSameAsk('${node.id}', event)"
              class="px-2.5 py-1 rounded-lg border transition ${qLiked
                ? 'bg-slate-200 text-slate-950 border-slate-200 font-semibold'
                : 'bg-slate-900/90 hover:bg-slate-800 text-slate-300 border-slate-800'}">
              同问 ${node.sameAskCount || 0}
            </button>
            <button type="button" onclick="openAnswerDialog(null, event)"
              class="px-2.5 py-1 rounded-lg bg-slate-800/90 hover:bg-slate-700 text-slate-200 border border-slate-700/80 transition">
              写回答
            </button>
          </div>
        </div>
      `;

      const dimsHtml = litDims.map(dimKey => {
        const meta = DIMENSIONS[dimKey];
        const activeNotes = getActiveNotes(node, dimKey);
        const king = activeNotes[0];
        const others = activeNotes.slice(1);
        const slot = getDimSlot(dimKey, litDims);
        const tx = cx + slot.dx, ty = cy + slot.dy;
        const kingLiked = isNoteLiked(king.id);
        const isDimSubfocused = subFocusTarget?.type === "dim" && subFocusTarget?.dimKey === dimKey;

        // 外侧竖向手风琴折叠块（如果该维度下还有第 2、3、4 名等其余答案）
        let outerAccordionHtml = "";
        if (others.length > 0) {
          const stripsHtml = others.map((n, idx) => {
            const key = `${dimKey}_${n.id}`;
            const isOpen = Boolean(expandedAccNotes[key]);
            const nLiked = isNoteLiked(n.id);
            if (!isOpen) {
              return `
                <div class="acc-strip" onclick="onAccStripClick('${dimKey}', ${n.id}, event)" title="点击展开完整回答">
                  <div class="flex items-center justify-between gap-2 text-xs">
                    <span class="text-slate-300 truncate">${escapeHtml(n.text)}</span>
                    <span class="text-[11px] text-slate-500 shrink-0">▲ ${n.votes || 0}</span>
                  </div>
                </div>
              `;
            }
            return `
              <div class="acc-strip is-open" onclick="onAccStripClick('${dimKey}', ${n.id}, event)">
                <div class="text-[13px] text-slate-100 leading-relaxed">
                  ${escapeHtml(n.text)}
                </div>
                <div class="flex items-center justify-between gap-2 mt-2.5 pt-2 border-t border-slate-800/80 text-[11px] text-slate-500">
                  <span class="truncate">${escapeHtml(n.author || "书友")}</span>
                  <button type="button" onclick="toggleVoteNote('${dimKey}', ${n.id}, event)"
                    class="px-2 py-0.5 rounded border transition ${nLiked
                      ? 'text-white border-slate-500 bg-slate-800'
                      : 'text-slate-400 border-slate-800 hover:text-slate-200'}">
                    ▲ ${n.votes || 0}
                  </button>
                </div>
              </div>
            `;
          }).join("");

          outerAccordionHtml = `
            <div class="dim-outer-wrap is-${slot.side}">
              <div class="dim-short-line"></div>
              <div class="dim-acc-col">
                ${stripsHtml}
              </div>
            </div>
          `;
        }

        return `
          <div class="dim-anchor" style="left:${tx}px; top:${ty}px;">
            <div class="dim-king-card ${isDimSubfocused ? 'is-subfocused' : ''}" onclick="onDimCardClick('${dimKey}', event)">
              <div class="flex items-center justify-between gap-2 mb-2">
                <span class="text-xs font-medium tracking-wide text-slate-400">${escapeHtml(meta.title)}</span>
                <button type="button" onclick="openAnswerDialog('${dimKey}', event)" title="补充一条${escapeHtml(meta.title)}"
                  class="text-xs w-5 h-5 rounded-md text-slate-500 hover:text-slate-200 hover:bg-slate-800 flex items-center justify-center transition">
                  +
                </button>
              </div>
              <div class="text-[13.5px] text-slate-100 leading-relaxed">
                ${escapeHtml(king.text)}
              </div>
              <div class="flex items-center justify-end gap-2.5 mt-3 pt-2 border-t border-slate-800/70 text-[11px] text-slate-500">
                <span class="truncate max-w-[140px]">${escapeHtml(king.author || "书友")}</span>
                <button type="button" onclick="toggleVoteNote('${dimKey}', ${king.id}, event)"
                  class="px-2 py-0.5 rounded border transition ${kingLiked
                    ? 'text-white border-slate-500 bg-slate-800'
                    : 'text-slate-400 border-slate-800/90 hover:text-slate-200'}">
                  ▲ ${king.votes || 0}
                </button>
              </div>
            </div>
            ${outerAccordionHtml}
          </div>
        `;
      }).join("");

      mmLayer.innerHTML = `<div style="position:absolute; left:${cx}px; top:${cy}px;">${centerHtml}</div>${dimsHtml}`;
      updateFocusNavBar();
    }

    // ==================== 聚焦镜头控制：中心全景 vs Auto-Pan 支线移镜 ====================
    function panToFocusOverview(animate = true) {
      if (!focusedNodeId) return;
      const p = nodePositions[focusedNodeId];
      if (!p) return;
      subFocusTarget = null;
      renderMindmap();
      const vw = window.innerWidth, vh = window.innerHeight;
      // 桌面端将中心与四角维度框完整纳入视野；手机端保持四维辐射脑图结构并居中放大问题中心
      let targetK;
      if (vw < 640) {
        targetK = Math.max(0.62, Math.min(0.76, vw / 540));
      } else {
        targetK = Math.max(0.72, Math.min(0.96, Math.min(vw / 1460, (vh - 90) / 680)));
      }
      centerOn(p.x, p.y, targetK, animate);
    }

    function onCenterCardClick(event) {
      if (event) event.stopPropagation();
      // 若当前镜头已经偏离到某个支线框，点中心卡先拉回问题中心；若已在中心，再次点击则收起回全局星图
      if (subFocusTarget) {
        panToFocusOverview(true);
      } else {
        resetView();
      }
    }

    function onDimCardClick(dimKey, event) {
      if (event) event.stopPropagation();
      if (!focusedNodeId) return;
      const node = getNodeById(focusedNodeId);
      const p = nodePositions[focusedNodeId];
      if (!node || !p) return;
      const litDims = ["d1", "d2", "d3", "d4"].filter(k => getActiveNotes(node, k).length > 0);
      const slot = getDimSlot(dimKey, litDims);
      subFocusTarget = { type: "dim", dimKey };
      renderMindmap();
      const vw = window.innerWidth;
      const targetK = vw < 640 ? Math.min(1.06, (vw - 36) / 300) : Math.max(camera.k, 1.05);
      centerOn(p.x + slot.dx, p.y + slot.dy, targetK, true);
    }

    function onAccStripClick(dimKey, noteId, event) {
      if (event) event.stopPropagation();
      if (!focusedNodeId) return;
      const key = `${dimKey}_${noteId}`;
      expandedAccNotes[key] = !expandedAccNotes[key];
      subFocusTarget = { type: "acc", dimKey, noteId };
      renderMindmap();

      // Auto-Pan 平滑移镜到外侧手风琴折叠列中心以便阅读
      const node = getNodeById(focusedNodeId);
      const p = nodePositions[focusedNodeId];
      if (!node || !p) return;
      const litDims = ["d1", "d2", "d3", "d4"].filter(k => getActiveNotes(node, k).length > 0);
      const slot = getDimSlot(dimKey, litDims);
      const sign = slot.side === "left" ? -1 : 1;
      const accCenterX = p.x + slot.dx + sign * (145 + 22 + 115);
      const accCenterY = p.y + slot.dy;
      const vw = window.innerWidth;
      const targetK = vw < 640 ? Math.min(1.08, (vw - 32) / 260) : Math.max(camera.k, 1.05);
      centerOn(accCenterX, accCenterY, targetK, true);
    }

    // 点赞回答与同问（即时翻转并重绘脑图）
    function toggleSameAsk(nodeId, event) {
      if (event) event.stopPropagation();
      const node = getNodeById(nodeId);
      if (!node) return;
      if (likedQuestions[nodeId]) {
        delete likedQuestions[nodeId];
        node.sameAskCount = Math.max(0, (node.sameAskCount || 1) - 1);
      } else {
        likedQuestions[nodeId] = true;
        node.sameAskCount = (node.sameAskCount || 0) + 1;
      }
      saveLikesState();
      saveData();
      renderGraph();
    }

    function toggleVoteNote(dimKey, noteId, event) {
      if (event) event.stopPropagation();
      const node = getNodeById(focusedNodeId);
      if (!node) return;
      const target = (node.branches[dimKey] || []).find(n => n.id === noteId);
      if (!target) return;
      if (likedNotes[noteId]) {
        delete likedNotes[noteId];
        target.votes = Math.max(0, (target.votes || 1) - 1);
      } else {
        likedNotes[noteId] = true;
        target.votes = (target.votes || 0) + 1;
      }
      saveLikesState();
      saveData();
      renderMindmap();
    }

    // ==================== 零负担写回答：直接写 + 自动分拣归类 + 顺竿爬免选 ====================
    let answerDialogLockedDim = null; // 若从维度框右上角 + 点进，则锁定该维度；否则为 null（自动识别）
    let answerDialogManualDim = null; // 用户点击右下角微调时的手动覆盖维度
    let answerDialogAutoDim = "d1";

    function detectDimensionFromText(text) {
      const t = String(text || "").trim();
      if (!t) return "d1";
      if (/就像|好比|相当于|打个比方|好比说|如同|好似|像极了|比作|比喻|好比是/.test(t)) {
        return "d3";
      }
      if (/伏笔|呼应|前面|后面|第一章|结局|埋线|闭环|首尾|铺垫|草蛇灰线|回旋镖|后面第|前面第/.test(t)) {
        return "d4";
      }
      if (/背景|其实|原著设定|没明说|隐含|前提|历史上|定律|潜台词|暗指|隐喻|之所以|设定里/.test(t)) {
        return "d2";
      }
      return "d1";
    }

    function updateAnswerDimBadge() {
      const badge = document.getElementById("answer-dim-badge");
      if (!badge) return;
      if (answerDialogLockedDim) {
        badge.textContent = `归入：${DIMENSIONS[answerDialogLockedDim].title}`;
      } else if (answerDialogManualDim) {
        badge.textContent = `已选：${DIMENSIONS[answerDialogManualDim].title} ▾`;
      } else {
        badge.textContent = `自动归入：${DIMENSIONS[answerDialogAutoDim].title} ▾`;
      }
    }

    function handleAnswerTextInput(val) {
      if (!answerDialogLockedDim && !answerDialogManualDim) {
        answerDialogAutoDim = detectDimensionFromText(val);
        updateAnswerDimBadge();
      }
    }

    function cycleAnswerDimOverride() {
      const order = ["d1", "d2", "d3", "d4"];
      if (answerDialogLockedDim) {
        const nextIdx = (order.indexOf(answerDialogLockedDim) + 1) % order.length;
        answerDialogLockedDim = order[nextIdx];
      } else {
        const cur = answerDialogManualDim || answerDialogAutoDim || "d1";
        const nextIdx = (order.indexOf(cur) + 1) % order.length;
        answerDialogManualDim = order[nextIdx];
      }
      updateAnswerDimBadge();
    }

    function openAnswerDialog(preselectedDim = null, event = null) {
      if (event) event.stopPropagation();
      const node = getNodeById(focusedNodeId);
      if (!node) return;
      const dlg = document.getElementById("answer-dialog");
      const titleEl = document.getElementById("answer-dialog-title");
      const qEl = document.getElementById("answer-dialog-question");
      const exBar = document.getElementById("answer-example-bar");
      const inputEl = document.getElementById("answer-text-input");
      if (!dlg || !inputEl) return;

      answerDialogLockedDim = preselectedDim && DIMENSIONS[preselectedDim] ? preselectedDim : null;
      answerDialogManualDim = null;
      answerDialogAutoDim = "d1";

      if (qEl) qEl.textContent = node.confusion;
      inputEl.value = "";

      if (answerDialogLockedDim) {
        const meta = DIMENSIONS[answerDialogLockedDim];
        if (titleEl) titleEl.textContent = `补充 · ${meta.title}`;
        inputEl.placeholder = meta.prompt;
        const active = getActiveNotes(node, answerDialogLockedDim);
        if (exBar) {
          if (active.length > 0) {
            const sample = active[0].text.slice(0, 42) + (active[0].text.length > 42 ? "…" : "");
            exBar.textContent = `参考当前榜一：“${sample}”`;
            exBar.classList.remove("hidden");
          } else {
            exBar.classList.add("hidden");
          }
        }
      } else {
        if (titleEl) titleEl.textContent = "写下你的理解（无需选分类，发送自动归入四维）";
        inputEl.placeholder = "写下你的理解…（比如：用一句话大白话点破 / 补齐书里没明说的背景设定 / 拿生活常识打个比方 / 点出和前后哪段情节呼应）";
        if (exBar) exBar.classList.add("hidden");
      }

      updateAnswerDimBadge();
      if (typeof dlg.showModal === "function") {
        dlg.showModal();
      } else {
        dlg.setAttribute("open", "");
      }
      setTimeout(() => inputEl.focus(), 50);
    }

    function closeAnswerDialog() {
      const dlg = document.getElementById("answer-dialog");
      if (dlg && dlg.open) dlg.close();
    }

    function submitAnswerForm(event) {
      event.preventDefault();
      const node = getNodeById(focusedNodeId);
      if (!node) return;
      const inputEl = document.getElementById("answer-text-input");
      const authorEl = document.getElementById("answer-author-input");
      const text = (inputEl?.value || "").trim();
      if (!text) return;
      const author = (authorEl?.value || "").trim() || "书友";
      const dimKey = answerDialogLockedDim || answerDialogManualDim || detectDimensionFromText(text);

      const newNote = {
        id: Date.now(),
        author,
        text,
        votes: 1,
        downvotes: 0
      };
      node.branches = node.branches || { d1: [], d2: [], d3: [], d4: [] };
      node.branches[dimKey] = node.branches[dimKey] || [];
      node.branches[dimKey].push(newNote);
      likedNotes[newNote.id] = true;

      // 若该维度已有更高赞榜一，新回答进入外侧手风琴并默认展开以便立刻看到
      const sorted = getActiveNotes(node, dimKey);
      if (sorted[0] && sorted[0].id !== newNote.id) {
        expandedAccNotes[`${dimKey}_${newNote.id}`] = true;
      }

      saveLikesState();
      saveData();
      closeAnswerDialog();
      renderMindmap();

      // 发送后镜头平滑聚焦到该维度框
      const p = nodePositions[node.id];
      if (p) {
        const litDims = ["d1", "d2", "d3", "d4"].filter(k => getActiveNotes(node, k).length > 0);
        const slot = getDimSlot(dimKey, litDims);
        subFocusTarget = { type: "dim", dimKey };
        renderMindmap();
        const vw = window.innerWidth;
        const targetK = vw < 640 ? Math.min(1.06, (vw - 36) / 300) : Math.max(camera.k, 1.0);
        centerOn(p.x + slot.dx, p.y + slot.dy, targetK, true);
      }
    }

    // Fallback for browsers without native <dialog closedby="any"> support (e.g. Safari)
    (function initAnswerDialogLightDismiss() {
      const dialog = document.getElementById("answer-dialog");
      if (!dialog) return;
      if (!("closedBy" in HTMLDialogElement.prototype)) {
        dialog.addEventListener("click", (event) => {
          if (event.target !== dialog) return;
          const rect = dialog.getBoundingClientRect();
          const isDialogContent = (
            rect.top <= event.clientY &&
            event.clientY <= rect.top + rect.height &&
            rect.left <= event.clientX &&
            event.clientX <= rect.left + rect.width
          );
          if (isDialogContent) return;
          dialog.close();
        });
      }
    })();


    function saveData() {
      lastLocalUpdateAt = Date.now();
      localStorage.setItem("bookgraph_v1_0", JSON.stringify(appData));
      localStorage.setItem("bookgraph_updated_at", String(lastLocalUpdateAt));
      pushToCloud(false);
    }

    function saveLikesState() {
      localStorage.setItem("bookgraph_liked_questions", JSON.stringify(likedQuestions));
      localStorage.setItem("bookgraph_liked_notes", JSON.stringify(likedNotes));
    }

    function isQuestionLiked(nodeId) {
      return Boolean(likedQuestions[nodeId]);
    }

    function isNoteLiked(noteId) {
      return Boolean(likedNotes[noteId]);
    }

    function getNodeById(id) {
      return appData.find(n => n.id === id);
    }

    function getNetScore(note) {
      return (note.votes || 0) - (note.downvotes || 0);
    }

    function isFolded(note) {
      return getNetScore(note) <= -3;
    }

    function getActiveNotes(node, dimKey) {
      return (node.branches[dimKey] || [])
        .filter(n => !isFolded(n))
        .sort((a, b) => getNetScore(b) - getNetScore(a));
    }

    function formatAuthor(note) {
      if (note.coAuthors && note.coAuthors.length > 0) {
        return `@${note.author} & @${note.coAuthors.join(", @")} 共创`;
      }
      return `@${note.author}`;
    }

    function getChapterMeta(chapterId) {
      return CHAPTERS.find(c => c.id === chapterId) || { id: "unlocated", shortName: "", name: "未归类章节", pos: "" };
    }

    // ==================== 顶栏 ··· 菜单控制 ====================
    function toggleHeaderMoreMenu(event) {
      if (event) event.stopPropagation();
      document.getElementById("header-more-menu")?.classList.toggle("hidden");
    }

    function hideHeaderMoreMenu() {
      document.getElementById("header-more-menu")?.classList.add("hidden");
    }

    document.addEventListener("click", (e) => {
      if (!e.target.closest("#header-more-wrap")) hideHeaderMoreMenu();
    });

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function nodeMatchesSearch(node, q) {
      if (!q) return true;
      const lower = q.toLowerCase();
      if ((node.confusion || "").toLowerCase().includes(lower)) return true;
      if ((node.quote || "").toLowerCase().includes(lower)) return true;
      for (const dimKey of Object.keys(DIMENSIONS)) {
        if (getActiveNotes(node, dimKey).some(n => (n.text || "").toLowerCase().includes(lower))) return true;
      }
      return false;
    }

    // ==================== 星图：数据 → 节点与连线 ====================
    // 圆点下方的简短问题文字（长问题截断，完整文字放在悬停提示里）
    function shortLabel(text, max = 16) {
      const t = String(text || "").replace(/\s+/g, "");
      return t.length > max ? t.slice(0, max) + "…" : t;
    }

    // 圆点半径：按“同问人数”缩放
    function nodeRadius(node) {
      const r = 5 + Math.sqrt(Math.max(0, node.sameAskCount || 0)) * 0.9;
      return Math.max(6, Math.min(22, r));
    }

    // 关联连线：来自回答里的 linkTo，以及节点自带的 links 数组（无向去重）
    function getGraphLinks() {
      const ids = new Set(appData.map(n => n.id));
      const seen = new Set();
      const links = [];
      const add = (a, b) => {
        if (!a || !b || a === b || !ids.has(a) || !ids.has(b)) return;
        const key = a < b ? `${a}|${b}` : `${b}|${a}`;
        if (seen.has(key)) return;
        seen.add(key);
        links.push({ source: a, target: b });
      };
      appData.forEach(node => {
        (node.links || []).forEach(t => add(node.id, t));
        Object.keys(node.branches || {}).forEach(k => {
          (node.branches[k] || []).forEach(note => add(node.id, note.linkTo));
        });
      });
      return links;
    }

    function getNeighborIds(nodeId) {
      const set = new Set();
      getGraphLinks().forEach(l => {
        if (l.source === nodeId) set.add(l.target);
        if (l.target === nodeId) set.add(l.source);
      });
      return set;
    }

    // ==================== 星图：力导向布局（位置只存在内存，不写入同步数据） ====================
    const nodePositions = {}; // { nodeId: {x, y} }

    function layoutGraph() {
      const nodes = appData;
      const links = getGraphLinks();
      const hasCache = nodes.some(n => nodePositions[n.id]);
      const fresh = new Set();

      // 新节点播种：有关联邻居就落在邻居附近，否则按黄金角螺旋散开
      nodes.forEach((node, i) => {
        if (nodePositions[node.id]) return;
        fresh.add(node.id);
        const neighbor = links
          .map(l => (l.source === node.id ? l.target : l.target === node.id ? l.source : null))
          .find(id => id && nodePositions[id]);
        if (neighbor) {
          const p = nodePositions[neighbor];
          const a = Math.random() * Math.PI * 2;
          nodePositions[node.id] = { x: p.x + Math.cos(a) * 120, y: p.y + Math.sin(a) * 120 };
        } else {
          const a = i * 2.39996;
          const rr = 60 + 55 * Math.sqrt(i + 1);
          nodePositions[node.id] = { x: Math.cos(a) * rr, y: Math.sin(a) * rr };
        }
      });

      // 已有布局时只移动新节点，避免整张星图跳动
      const movable = id => !hasCache || fresh.has(id);
      if (hasCache && fresh.size === 0) return;

      const iterations = 260;
      for (let it = 0; it < iterations; it++) {
        const cool = 1 - it / iterations;
        const disp = {};
        nodes.forEach(n => (disp[n.id] = { x: 0, y: 0 }));

        // 斥力：防止圆点和文字互相重叠
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const a = nodePositions[nodes[i].id], b = nodePositions[nodes[j].id];
            let dx = a.x - b.x, dy = a.y - b.y;
            let d2 = dx * dx + dy * dy;
            if (d2 < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 1; }
            const d = Math.sqrt(d2);
            const f = 60000 / d2;
            disp[nodes[i].id].x += (dx / d) * f; disp[nodes[i].id].y += (dy / d) * f;
            disp[nodes[j].id].x -= (dx / d) * f; disp[nodes[j].id].y -= (dy / d) * f;
          }
        }
        // 引力：有关联的问题彼此靠近
        links.forEach(l => {
          const a = nodePositions[l.source], b = nodePositions[l.target];
          const dx = a.x - b.x, dy = a.y - b.y;
          const d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
          const f = (d - 170) * 0.06;
          disp[l.source].x -= (dx / d) * f; disp[l.source].y -= (dy / d) * f;
          disp[l.target].x += (dx / d) * f; disp[l.target].y += (dy / d) * f;
        });
        // 向心力：整体不要飘散
        nodes.forEach(n => {
          const p = nodePositions[n.id];
          disp[n.id].x -= p.x * 0.012; disp[n.id].y -= p.y * 0.012;
        });

        const maxStep = 30 * cool + 1;
        nodes.forEach(n => {
          if (!movable(n.id)) return;
          const d = disp[n.id];
          const len = Math.sqrt(d.x * d.x + d.y * d.y) || 1;
          const step = Math.min(len, maxStep);
          nodePositions[n.id].x += (d.x / len) * step;
          nodePositions[n.id].y += (d.y / len) * step;
        });
      }
    }

    // ==================== 星图：渲染 ====================
    let focusedNodeId = null;

    function renderGraph() {
      // 清理已删除节点的位置缓存
      const ids = new Set(appData.map(n => n.id));
      Object.keys(nodePositions).forEach(id => { if (!ids.has(id)) delete nodePositions[id]; });
      if (focusedNodeId && !ids.has(focusedNodeId)) focusedNodeId = null;

      layoutGraph();

      const linksLayer = document.getElementById("links-layer");
      const nodesLayer = document.getElementById("nodes-layer");
      if (!linksLayer || !nodesLayer) return;

      linksLayer.innerHTML = getGraphLinks().map(l => {
        const a = nodePositions[l.source], b = nodePositions[l.target];
        return `<line class="link" data-a="${l.source}" data-b="${l.target}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"></line>`;
      }).join("");

      nodesLayer.innerHTML = appData.map(node => {
        const p = nodePositions[node.id];
        const r = nodeRadius(node);
        return `
          <button type="button" class="star" data-id="${node.id}"
            style="left:${p.x}px; top:${p.y}px; --r:${r}px"
            title="${escapeHtml(node.confusion)}"
            aria-label="${escapeHtml(node.confusion)}（${node.sameAskCount || 0} 人同问）">
            <span class="star-dot"></span>
            <span class="star-label">${escapeHtml(shortLabel(node.confusion))}</span>
          </button>
        `;
      }).join("");

      applyGraphState();
      renderMindmap();
    }

    // 根据「聚焦 / 搜索」状态给节点和连线加淡出、高亮样式
    function applyGraphState() {
      const neighbors = focusedNodeId ? getNeighborIds(focusedNodeId) : new Set();
      const q = searchQuery;
      let matchCount = 0;

      document.querySelectorAll("#nodes-layer .star").forEach(el => {
        const id = el.dataset.id;
        const node = getNodeById(id);
        el.classList.remove("is-focus", "is-neighbor", "is-hidden", "is-match", "is-faint");
        if (focusedNodeId) {
          if (id === focusedNodeId) el.classList.add("is-focus");
          else if (neighbors.has(id)) el.classList.add("is-neighbor");
          else el.classList.add("is-hidden");
        } else if (q) {
          if (node && nodeMatchesSearch(node, q)) { el.classList.add("is-match"); matchCount++; }
          else el.classList.add("is-faint");
        }
      });

      document.querySelectorAll("#links-layer .link").forEach(el => {
        el.classList.remove("is-active", "is-hidden", "is-faint");
        if (focusedNodeId) {
          const touches = el.dataset.a === focusedNodeId || el.dataset.b === focusedNodeId;
          el.classList.add(touches ? "is-active" : "is-hidden");
        } else if (q) {
          el.classList.add("is-faint");
        }
      });

      document.getElementById("stage")?.classList.toggle("has-focus", Boolean(focusedNodeId));
      return matchCount;
    }

    // ==================== 镜头：平移 / 缩放 / 平滑聚焦 ====================
    const camera = { x: 0, y: 0, k: 1 };
    const MIN_K = 0.25, MAX_K = 3;

    function applyCamera(animate = false) {
      const world = document.getElementById("world");
      if (!world) return;
      world.classList.toggle("animating", animate);
      world.style.transform = `translate(${camera.x}px, ${camera.y}px) scale(${camera.k})`;
      if (animate) {
        clearTimeout(applyCamera._t);
        applyCamera._t = setTimeout(() => world.classList.remove("animating"), 650);
      }
    }

    function clampK(k) { return Math.max(MIN_K, Math.min(MAX_K, k)); }

    // 把世界坐标 (wx, wy) 放到屏幕中心，缩放到 k
    function centerOn(wx, wy, k, animate = true) {
      const vw = window.innerWidth, vh = window.innerHeight;
      const topOffset = 32; // 顶部悬浮栏占位，视觉中心略往下
      camera.k = clampK(k);
      camera.x = vw / 2 - wx * camera.k;
      camera.y = (vh + topOffset) / 2 - wy * camera.k;
      applyCamera(animate);
    }

    function zoomAt(sx, sy, factor, animate = false) {
      const k = clampK(camera.k * factor);
      const wx = (sx - camera.x) / camera.k, wy = (sy - camera.y) / camera.k;
      camera.k = k;
      camera.x = sx - wx * k;
      camera.y = sy - wy * k;
      applyCamera(animate);
    }

    function zoomBy(factor) {
      zoomAt(window.innerWidth / 2, window.innerHeight / 2, factor, true);
    }

    // 全景：把所有节点装进屏幕
    function fitAll(animate = true) {
      const pts = appData.map(n => nodePositions[n.id]).filter(Boolean);
      if (pts.length === 0) { centerOn(0, 0, 1, animate); return; }
      const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
      const minX = Math.min(...xs) - 90, maxX = Math.max(...xs) + 90;
      const minY = Math.min(...ys) - 60, maxY = Math.max(...ys) + 90;
      const vw = window.innerWidth, vh = window.innerHeight - 80;
      const k = Math.min(vw / (maxX - minX), vh / (maxY - minY), 1.3);
      centerOn((minX + maxX) / 2, (minY + maxY) / 2, k, animate);
    }

    // 回到全局星图：收起聚焦 + 全景
    function resetView() {
      focusedNodeId = null;
      subFocusTarget = null;
      expandedAccNotes = {};
      applyGraphState();
      renderMindmap();
      fitAll(true);
    }

    // ==================== 单点聚焦（全场唯一展开） ====================
    function focusNode(nodeId) {
      if (!getNodeById(nodeId)) return;
      focusedNodeId = nodeId;
      subFocusTarget = null;
      expandedAccNotes = {};
      applyGraphState();
      panToFocusOverview(true);
    }

    function onStarClick(nodeId) {
      if (Date.now() - (window.__lastDragEnd || 0) < 120) return;
      if (focusedNodeId === nodeId) {
        resetView(); // 再次点击同一个问题 → 收起，回到全局星图
      } else {
        focusNode(nodeId);
      }
    }

    // ==================== 画布手势：拖拽平移、滚轮缩放、双指缩放、两段式返回判定 ====================
    function initStageGestures() {
      const stage = document.getElementById("stage");
      if (!stage) return;
      const pointers = new Map();
      let dragMoved = false;
      let downTarget = null;
      let lastPinchDist = 0;

      stage.addEventListener("pointerdown", (e) => {
        if (e.button !== 0 && e.pointerType === "mouse") return;
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, captured: false });
        if (pointers.size === 1) {
          dragMoved = false;
          downTarget = e.target;
        }
        if (pointers.size === 2) {
          const [a, b] = [...pointers.values()];
          lastPinchDist = Math.hypot(a.x - b.x, a.y - b.y);
          dragMoved = true;
        }
      });

      stage.addEventListener("pointermove", (e) => {
        const p = pointers.get(e.pointerId);
        if (!p) return;
        const dx = e.clientX - p.x, dy = e.clientY - p.y;
        p.x = e.clientX; p.y = e.clientY;

        if (pointers.size === 1) {
          if (Math.hypot(e.clientX - p.sx, e.clientY - p.sy) > 5) {
            dragMoved = true;
            stage.classList.add("dragging");
            if (!p.captured) {
              try { stage.setPointerCapture(e.pointerId); p.captured = true; } catch (_) {}
            }
          }
          if (dragMoved) {
            camera.x += dx; camera.y += dy;
            applyCamera(false);
          }
        } else if (pointers.size === 2) {
          const [a, b] = [...pointers.values()];
          const dist = Math.hypot(a.x - b.x, a.y - b.y);
          if (lastPinchDist > 0) {
            zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, dist / lastPinchDist, false);
          }
          lastPinchDist = dist;
        }
      });

      const endPointer = (e) => {
        if (!pointers.has(e.pointerId)) return;
        pointers.delete(e.pointerId);
        if (pointers.size < 2) lastPinchDist = 0;
        if (pointers.size === 0) {
          stage.classList.remove("dragging");
          if (dragMoved) {
            window.__lastDragEnd = Date.now();
          } else if (e.type === "pointerup" && downTarget) {
            const starEl = downTarget.closest?.(".star");
            const inMindmapCard = downTarget.closest?.(".focus-center-card, .dim-king-card, .acc-strip");
            if (starEl) {
              onStarClick(starEl.dataset.id);
            } else if (!inMindmapCard && focusedNodeId) {
              // 两段式防迷路返回：若已 Auto-Pan 偏离中心，先拉回问题中心；否则退回全局星图
              if (subFocusTarget) {
                panToFocusOverview(true);
              } else {
                resetView();
              }
            }
          }
          downTarget = null;
        }
      };
      stage.addEventListener("pointerup", endPointer);
      stage.addEventListener("pointercancel", endPointer);

      stage.addEventListener("wheel", (e) => {
        e.preventDefault();
        const factor = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015));
        zoomAt(e.clientX, e.clientY, factor, false);
      }, { passive: false });

      // 键盘：Tab 到圆点后回车/空格也能聚焦
      stage.addEventListener("keydown", (e) => {
        const star = e.target.closest?.(".star");
        if (star && (e.key === "Enter" || e.key === " ")) {
          e.preventDefault();
          onStarClick(star.dataset.id);
        }
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && focusedNodeId && !document.querySelector("dialog[open]")) resetView();
      });

      window.addEventListener("resize", () => {
        clearTimeout(initStageGestures._r);
        initStageGestures._r = setTimeout(() => {
          if (focusedNodeId) focusNode(focusedNodeId); else fitAll(false);
        }, 150);
      });
    }

    // ==================== 顶部搜索框：星图高亮联动 + 回车直接提问 ====================
    function handleSearchInput(val) {
      searchQuery = (val || "").trim();
      if (searchQuery && focusedNodeId) { focusedNodeId = null; subFocusTarget = null; renderMindmap(); }
      const count = applyGraphState();
      const hint = document.getElementById("search-hint");
      if (!hint) return;
      if (!searchQuery) {
        hint.classList.add("hidden");
        return;
      }
      hint.classList.remove("hidden");
      hint.textContent = count > 0
        ? `星图里有 ${count} 个相关问题已高亮 · 没找到想要的？按回车直接提问`
        : `还没人问过 · 按回车或点「提问」把它发出来`;
    }

    function handleSearchKeydown(event) {
      if (event.key === "Enter" && !event.isComposing) {
        event.preventDefault();
        submitNewQuestion();
      } else if (event.key === "Escape") {
        clearSearch();
        event.target.blur();
      }
    }

    function clearSearch() {
      const input = document.getElementById("unified-search-input");
      if (input) input.value = "";
      handleSearchInput("");
    }

    function onAskButton() {
      const input = document.getElementById("unified-search-input");
      if (input && input.value.trim()) {
        submitNewQuestion();
      } else if (input) {
        input.focus();
        const hint = document.getElementById("search-hint");
        if (hint) {
          hint.classList.remove("hidden");
          hint.textContent = "在这里写下你的问题，回车即可发出";
        }
      }
    }

    // 直接在画布上生成一颗新的问题圆点并立即聚焦
    function submitNewQuestion() {
      const input = document.getElementById("unified-search-input");
      const confusion = (input?.value || "").trim();
      if (!confusion) { input?.focus(); return; }

      const newNode = {
        id: "node-" + Date.now(),
        chapterId: "unlocated",
        quote: "",
        confusion,
        sameAskCount: 1,
        branches: { d1: [], d2: [], d3: [], d4: [] }
      };
      appData.unshift(newNode);
      likedQuestions[newNode.id] = true;
      saveLikesState();
      saveData();

      // 新圆点落在当前屏幕中心附近
      const wx = (window.innerWidth / 2 - camera.x) / camera.k;
      const wy = (window.innerHeight / 2 - camera.y) / camera.k;
      nodePositions[newNode.id] = { x: wx + (Math.random() - 0.5) * 40, y: wy + (Math.random() - 0.5) * 40 };

      if (input) { input.value = ""; input.blur(); }
      searchQuery = "";
      document.getElementById("search-hint")?.classList.add("hidden");
      renderGraph();
      focusNode(newNode.id);
    }

    function resetDemoData() {
      if (!confirm("确定要将本机与云端数据重置回初始《三体 II》演示数据吗？")) return;
      localStorage.removeItem("bookgraph_v1_0");
      localStorage.removeItem("bookgraph_liked_questions");
      localStorage.removeItem("bookgraph_liked_notes");
      likedQuestions = {};
      likedNotes = {};
      appData = JSON.parse(JSON.stringify(defaultData));
      Object.keys(nodePositions).forEach(id => delete nodePositions[id]);
      saveData();
      renderGraph();
      resetView();
    }

    // ==================== 跨设备云端实时同步 & 备份逻辑 ====================
    function setCloudStatus(state, message) {
      const dot = document.getElementById("cloud-status-dot");
      const text = document.getElementById("cloud-status-text");
      const modalStatus = document.getElementById("sync-modal-status");
      if (!dot || !text) return;

      if (state === "syncing") {
        dot.className = "w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse inline-block";
        text.innerText = "同步中";
        if (modalStatus) modalStatus.innerText = "🔄 " + (message || "正在与云端同步...");
      } else if (state === "ok") {
        dot.className = "w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block";
        text.innerText = "已连";
        if (modalStatus) modalStatus.innerText = "☁️ " + (message || "云端实时同步正常");
      } else {
        dot.className = "w-1.5 h-1.5 rounded-full bg-rose-400 inline-block";
        text.innerText = "本地";
        if (modalStatus) modalStatus.innerText = "⚠️ " + (message || "当前离线，已保存在本地缓存");
      }
    }

    function refreshCurrentView() {
      renderGraph();
    }

    async function pullFromCloud(manual = false) {
      if (manual) setCloudStatus("syncing", "正在拉取最新数据...");
      // 优先同步本机私有服务 /api/data (data.json)
      if (location.protocol.startsWith("http")) {
        try {
          const localRes = await fetch(`/api/data?t=${Date.now()}`, { cache: "no-store" });
          if (localRes.ok) {
            const payload = await localRes.json();
            if (Array.isArray(payload?.nodes) && payload.nodes.length > 0) {
              appData = upgradeAndNormalizeData(payload.nodes);
              lastLocalUpdateAt = Number(payload.updatedAt || Date.now());
              localStorage.setItem("bookgraph_v1_0", JSON.stringify(appData));
              localStorage.setItem("bookgraph_updated_at", String(lastLocalUpdateAt));
              refreshCurrentView();
              setCloudStatus("ok", `已与本机 data.json 同步 (${new Date().toLocaleTimeString()})`);
              return;
            } else {
              await pushToCloud(false);
              return;
            }
          }
        } catch (_) {}
      }

      if (!cloudRoomId) return;
      try {
        const res = await fetch(`${CLOUD_API_BASE}/${cloudRoomId}?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const payload = await res.json();
        const remoteNodes = payload?.data?.nodes;
        const remoteUpdatedAt = Number(payload?.data?.updatedAt || 0);

        if (Array.isArray(remoteNodes) && remoteNodes.length > 0) {
          if (manual || remoteUpdatedAt >= lastLocalUpdateAt || !localStorage.getItem("bookgraph_v1_0")) {
            appData = upgradeAndNormalizeData(remoteNodes);
            lastLocalUpdateAt = remoteUpdatedAt || Date.now();
            localStorage.setItem("bookgraph_v1_0", JSON.stringify(appData));
            localStorage.setItem("bookgraph_updated_at", String(lastLocalUpdateAt));
            refreshCurrentView();
          }
          setCloudStatus("ok", `已同步 (${new Date().toLocaleTimeString()})`);
        } else {
          await pushToCloud(false);
        }
      } catch (err) {
        console.warn("Cloud pull skipped:", err);
        setCloudStatus("offline", "网络离线或受限，已启用本地存储兜底");
      }
    }

    async function pushToCloud(manual = false) {
      setCloudStatus("syncing", "正在保存数据...");
      const now = Date.now();
      lastLocalUpdateAt = now;
      localStorage.setItem("bookgraph_updated_at", String(now));

      // 优先写入本机私有服务 /api/data (data.json)
      if (location.protocol.startsWith("http")) {
        try {
          const localRes = await fetch("/api/data", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ updatedAt: now, nodes: appData })
          });
          if (localRes.ok) {
            setCloudStatus("ok", `已存入本机 data.json (${new Date().toLocaleTimeString()})`);
            if (manual) alert("✅ 已保存到本机 data.json！");
            return;
          }
        } catch (_) {}
      }

      if (!cloudRoomId) return;
      try {
        const res = await fetch(`${CLOUD_API_BASE}/${cloudRoomId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: "bookgraph_v1_0",
            data: {
              updatedAt: now,
              nodes: appData
            }
          })
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        setCloudStatus("ok", `已同步到云端 (${new Date().toLocaleTimeString()})`);
        if (manual) alert("✅ 已成功将本机黑板数据推送到云端！");
      } catch (err) {
        console.warn("Cloud push failed:", err);
        setCloudStatus("offline", "云端推送失败，数据已安全保存在本地");
        if (manual) alert("⚠️ 云端推送失败，请检查网络或点击「新建独立云端房间」重试。");
      }
    }

    function openSyncModal() {
      document.getElementById("sync-room-input").value = cloudRoomId;
      const modal = document.getElementById("sync-modal");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeSyncModal() {
      const modal = document.getElementById("sync-modal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    async function saveSyncRoomId() {
      const val = document.getElementById("sync-room-input").value.trim();
      if (!val) return alert("请输入有效的云端房间 ID");
      cloudRoomId = val;
      localStorage.setItem("bookgraph_cloud_room_id", cloudRoomId);
      await pullFromCloud(true);
      alert("✅ 已切换云端同步房间 ID！");
    }

    async function createNewSyncRoom() {
      setCloudStatus("syncing", "正在创建新云端房间...");
      try {
        const now = Date.now();
        const res = await fetch(CLOUD_API_BASE, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: "bookgraph_v1_0",
            data: {
              updatedAt: now,
              nodes: appData
            }
          })
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const created = await res.json();
        if (created && created.id) {
          cloudRoomId = created.id;
          localStorage.setItem("bookgraph_cloud_room_id", cloudRoomId);
          document.getElementById("sync-room-input").value = cloudRoomId;
          setCloudStatus("ok", "新房间已创建并同步");
          alert(`🎉 新建云端房间成功！\n房间 ID: ${cloudRoomId}\n将该 ID 复制到手机或其它电脑即可互通。`);
        }
      } catch (err) {
        setCloudStatus("offline", "创建云端房间失败");
        alert("创建失败，请检查网络连接。");
      }
    }

    function exportJsonData() {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `死磕黑板备份_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importJsonData(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!Array.isArray(parsed)) throw new Error("格式不正确");
          appData = parsed;
          saveData();
          refreshCurrentView();
          closeSyncModal();
          alert("✅ 数据导入成功并已同步至云端！");
        } catch (err) {
          alert("导入失败：请选择有效的 JSON 备份文件");
        }
      };
      reader.readAsText(file);
    }

    window.addEventListener("load", () => {
      initStageGestures();
      renderGraph();
      fitAll(false);
      pullFromCloud(false);
      // 切回标签页或手机唤醒时自动拉取最新云端数据
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") pullFromCloud(false);
      });
    });
  </script>
</body>
</html>
